name: Datos históricos

# Descarga partidos pasados (fútbol, NBA, MLB) para la prueba retrospectiva y el
# entrenamiento de la red. Guarda data/historico en la misma rama.
on:
  workflow_dispatch:
    inputs:
      partes:
        description: 'Qué descargar (futbol nba mlb; vacío = todo)'
        required: false
        default: ''
  push:
    branches: [claude/quirky-ptolemy-t7wcuw]
    paths:
      - scripts/historico/**
      - .github/workflows/historico.yml

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: MLB
        if: ${{ github.event.inputs.partes == '' || contains(github.event.inputs.partes, 'mlb') }}
        run: node scripts/historico/descargar.mjs mlb
      - name: Guardar MLB
        if: always()
        run: scripts/historico/guardar.sh "Datos históricos: MLB"
      - name: NBA
        if: ${{ github.event.inputs.partes == '' || contains(github.event.inputs.partes, 'nba') }}
        run: node scripts/historico/descargar.mjs nba
      - name: Guardar NBA
        if: always()
        run: scripts/historico/guardar.sh "Datos históricos: NBA"
      - name: Fútbol
        if: ${{ github.event.inputs.partes == '' || contains(github.event.inputs.partes, 'futbol') }}
        run: node scripts/historico/descargar.mjs futbol
      - name: Guardar fútbol
        if: always()
        run: scripts/historico/guardar.sh "Datos históricos: fútbol"
