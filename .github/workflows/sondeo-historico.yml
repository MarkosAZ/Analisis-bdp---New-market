name: Sondeo de datos históricos (temporal)

# Temporal: qué fuentes tienen partidos pasados con estadísticas (fútbol, NBA, MLB).
# Se borra antes de unir a main.
on:
  push:
    branches: [claude/quirky-ptolemy-t7wcuw]
    paths:
      - scripts/sondeo-historico.mjs
      - .github/workflows/sondeo-historico.yml

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sondeo
        run: node scripts/sondeo-historico.mjs
