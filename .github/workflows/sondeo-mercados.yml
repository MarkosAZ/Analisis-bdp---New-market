name: Sondeo de tipos de mercado de Apuesta Total (temporal)

# Temporal: busca qué tipos de mercado de Apuesta Total traen los mercados de la
# lista (tiros al arco, remates, primer tiempo del básquet...). Se borra antes de unir a main.
on:
  push:
    branches: [claude/quirky-ptolemy-t7wcuw]
    paths:
      - scripts/sondeo-mercados.mjs
      - .github/workflows/sondeo-mercados.yml

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sondeo
        run: node scripts/sondeo-mercados.mjs
